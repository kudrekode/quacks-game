<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" role="img" aria-labelledby="title"><title id="title">Confirmation modal</title><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1cf75"/><stop offset=".48" stop-color="#b47a29"/><stop offset="1" stop-color="#5b3515"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6e9c5"/><stop offset="1" stop-color="#cdb889"/></linearGradient><filter id="shadow"><feDropShadow dy="5" stdDeviation="4" flood-opacity=".65"/></filter><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#shadow)"><rect x="24" y="25" width="272" height="200" rx="8" fill="url(#paper)" stroke="#765028" stroke-width="6"/><circle cx="277" cy="44" r="13" fill="#a7482b"/><text x="277" y="51" text-anchor="middle" fill="#fff" font-size="20">×</text><text x="160" y="72" text-anchor="middle" fill="#382719" font-family="Georgia" font-size="24">End Your Turn?</text><text x="160" y="112" text-anchor="middle" fill="#392d22" font-family="Georgia" font-size="15">Are you sure you want to</text><text x="160" y="133" text-anchor="middle" fill="#392d22" font-family="Georgia" font-size="15">stop brewing?</text><rect x="45" y="165" width="100" height="36" rx="5" fill="#9a292d"/><rect x="175" y="165" width="100" height="36" rx="5" fill="#337d26"/><text x="95" y="188" text-anchor="middle" fill="#fff" font-family="Georgia">Cancel</text><text x="225" y="188" text-anchor="middle" fill="#fff" font-family="Georgia">Yes, Stop</text></g></svg>
