<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260" role="img" aria-labelledby="title"><title id="title">Rules modal</title><defs><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1cf75"/><stop offset=".48" stop-color="#b47a29"/><stop offset="1" stop-color="#5b3515"/></linearGradient><linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6e9c5"/><stop offset="1" stop-color="#cdb889"/></linearGradient><filter id="shadow"><feDropShadow dy="5" stdDeviation="4" flood-opacity=".65"/></filter><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g filter="url(#shadow)"><rect x="24" y="18" width="272" height="224" rx="8" fill="url(#paper)" stroke="#765028" stroke-width="6"/><circle cx="277" cy="37" r="13" fill="#a7482b"/><text x="277" y="44" text-anchor="middle" fill="#fff" font-size="20">×</text><text x="160" y="60" text-anchor="middle" fill="#382719" font-family="Georgia" font-size="24">Rule Reminder</text><text x="48" y="100" fill="#392d22" font-family="Georgia" font-size="15">White ingredients increase your</text><text x="48" y="121" fill="#392d22" font-family="Georgia" font-size="15">risk of explosion.</text><text x="48" y="158" fill="#392d22" font-family="Georgia" font-size="15">If your total exceeds 7, you explode!</text><rect x="110" y="188" width="100" height="34" rx="5" fill="#337d26"/><text x="160" y="211" text-anchor="middle" fill="#fff" font-family="Georgia" font-size="16">Got it!</text></g></svg>
